name: Release

# Publishes the Docker image to the GitHub Container Registry on a version tag.
# See RELEASE.md for the full release procedure.
on:
  push:
    tags:
      - "v*"

jobs:
  publish-image:
    runs-on: ubuntu-24.04
    # A release takes about 5 minutes; without this a hung step would run for GitHub's 6 hours.
    timeout-minutes: 30
    permissions:
      contents: write # edit the release notes to link the image
      packages: write # push to ghcr.io
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history + tags so BuildInfo's `git describe` resolves
          # This job's token can write packages, and the build runs third-party code; nothing here
          # needs the token in .git/config (`git describe` is local).
          persist-credentials: false

      - name: Install Nix
        # Nix's own installer, pinned and verified; see the script.
        # Its download of the Nix tarball has no retry or timeout of its own.
        # No GITHUB_TOKEN: the installer writes it to /etc/nix/nix.conf, which any process can read,
        # and this job's token can write packages. One flake fetch per release stays well inside
        # GitHub's anonymous rate limit.
        timeout-minutes: 5
        run: .github/scripts/install-nix.sh

      - name: Stage the Docker build context
        # Native-packager writes the Dockerfile + app under target/docker/stage (no daemon needed).
        run: nix develop .#ci --command sbt Docker/stage

      # The staged context is JVM bytecode plus a Dockerfile whose only RUN steps
      # are chmod and useradd, and both native dependencies (blst-java,
      # rocksdbjni) ship linux/aarch64 objects inside the same jars. So arm64
      # needs no separate build -- only a runtime that can execute those two
      # trivial RUN steps, which QEMU covers cheaply for 168 files.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/cardano-hydrozoa/hydrozoa
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: target/docker/stage
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # The release itself is written by hand (GitHub's generated changelog), and
      # it never said where the image is. Append that once the digest is known.
      # Idempotent: re-running the workflow for a tag will not append twice.
      - name: Link the image from the release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ github.ref_name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          if ! gh release view "$VERSION" >/dev/null 2>&1; then
            echo "no release for $VERSION yet — skipping (create it, then re-run to link)"
            exit 0
          fi
          body=$(gh release view "$VERSION" --json body -q .body)
          if printf '%s' "$body" | grep -q '^## Container image'; then
            echo "release notes already link the image — nothing to do"
            exit 0
          fi
          v="${VERSION#v}"
          # Every line stays inside the `run:` block scalar — a line at column 0
          # would end the scalar and leave the workflow file unparseable. The
          # fences and the code spans are literal backticks, so each printf
          # format string is single-quoted.
          fence='```'
          {
            printf '%s\n\n' "$body"
            printf '## Container image\n\n'
            printf '%s\n' "$fence"
            printf 'docker pull ghcr.io/cardano-hydrozoa/hydrozoa:%s\n' "$v"
            printf '%s\n\n' "$fence"
            printf 'Also tagged `%s` and `latest`. Platforms: `linux/amd64`, `linux/arm64`.\n\n' "${v%.*}"
            printf 'Digest: `%s`\n' "$DIGEST"
          } > /tmp/body.md
          gh release edit "$VERSION" --notes-file /tmp/body.md
          echo "linked ghcr.io/cardano-hydrozoa/hydrozoa:${v} from the $VERSION release notes"
