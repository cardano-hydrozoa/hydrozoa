name: Docs (GitHub Pages)

# Publishes docs/ (the user guide + design/reference docs) to GitHub Pages with
# Jekyll. Requires Settings → Pages → Source = "GitHub Actions" (one-time).
#
# The build-docs job also runs on docs PRs to validate the Jekyll build before merge;
# only a push to main (or a manual run) actually deploys.

on:
  push:
    branches: ["main"]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; never cancel an in-progress production deploy. PR runs only build, so
# each PR gets a group of its own: in the shared group a newer pending run replaces an older
# pending one, and a burst of docs PRs could cancel a pending deploy.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('docs-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Not named `build`: that is the CI workflow's job, the repository's required check, and a
  # second check of the same name on docs PRs would be ambiguous.
  build-docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1.0.13
        with:
          source: ./docs
          destination: ./_site
      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0

  deploy:
    # Validate on PRs (build only); deploy only on a push to main or a manual run.
    if: github.event_name != 'pull_request'
    needs: build-docs
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
