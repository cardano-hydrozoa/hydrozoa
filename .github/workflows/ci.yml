name: CI

on:
  pull_request:
  # A merge queue tests each queued PR (or batch) on top of main before merging it; this is the
  # event it sends. Harmless until the queue is enabled in the repository's ruleset.
  merge_group:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The job's GITHUB_TOKEN may only read the repository. It is minted per job and expires with it.
permissions:
  contents: read

jobs:
  # The `build` job is a required status check (repository ruleset on `main`). It must ALWAYS run
  # and report, or the ruleset blocks the merge — so we do NOT path-filter the workflow itself.
  # Instead, a PR's changed paths decide which steps run inside it (see "Plan the run"), and a
  # PR that touches no code passes in about a minute.
  build:
    # Pinned rather than ubuntu-latest, so the host image changes only when we change it. Nix
    # supplies the toolchain; the host matters for Docker (the Yaci suites), the kernel and disk.
    runs-on: ubuntu-24.04
    # Without this the job inherits GitHub's 6-hour default. The integration suite has wedged
    # before (real-clock properties), and each time it burned hours of a hosted runner and produced
    # no diagnosable artifact. 90 minutes turns a wedge into a red build within the hour or so.
    timeout-minutes: 90
    steps:
      # Depth 2 brings in both parents of the PR test merge that `pull_request` checks out, which
      # is what "Plan the run" diffs against.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      # What runs: everything, unless this is a PR whose changes are confined to test code or docs.
      # The script puts each changed file in one bucket: docs (docs/ or any *.md), unit
      # (src/test/), integration (integration/), or other (production code, build, Nix,
      # workflows...). Unit-test code can't affect the integration suites, nor integration-test
      # code the unit tests; anything in `other` runs everything. Merge-queue and manual runs
      # always run everything, and so does a PR whose change set can't be determined.
      - name: Plan the run
        id: plan
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: .github/scripts/classify-changes.sh

      - name: Install Nix
        if: steps.plan.outputs.code == 'true'
        # Nix's own installer, pinned and verified; see the script.
        # Its download of the Nix tarball has no retry or timeout of its own.
        timeout-minutes: 5
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: .github/scripts/install-nix.sh

      - name: Cache sbt / coursier / ivy
        if: steps.plan.outputs.code == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.sbt
            ~/.cache/coursier
            ~/.ivy2/cache
          key: sbt-${{ runner.os }}-${{ hashFiles('**/build.sbt', 'project/**') }}
          restore-keys: sbt-${{ runner.os }}-

      # `.#ci` is the flake's CI shell: the JDK, sbt, just and nixfmt, without the developer tools.
      - name: Format / lint / nixfmt checks
        if: steps.plan.outputs.code == 'true'
        run: nix develop .#ci --command just precommit

      - name: Unit tests
        if: steps.plan.outputs.unit == 'true'
        run: nix develop .#ci --command just test

      # Under CI the build points the forked test JVMs at logback-ci.xml: WARN and above on the
      # console, everything down to TRACE in integration/integration-tests.log, uploaded below.
      - name: Integration tests
        if: steps.plan.outputs.integration == 'true'
        run: nix develop .#ci --command just integration-fast

      - name: Upload integration log
        if: always() && steps.plan.outputs.integration == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: integration-log-attempt-${{ github.run_attempt }}
          path: |
            integration/integration-tests.log
            integration/stage4-peers-interaction.mmd
          if-no-files-found: ignore
          retention-days: 3

      # The bloxbean/yaci-cli image is ~578 MB and dominates the yaci-suite runtime on a
      # cold runner (~3.5 min pull). Cache the tarball keyed on build.sbt so any bump of
      # testcontainers / scalus-testkit / bloxbean invalidates it, but everything else
      # rides on the last cached image (via restore-keys). Testcontainers picks up the
      # loaded image transparently — no shim required.
      - name: Cache Yaci DevKit image
        if: steps.plan.outputs.integration == 'true'
        id: yaci-image-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/docker-images/yaci-cli.tar
          key: docker-yaci-cli-${{ hashFiles('**/build.sbt') }}
          restore-keys: docker-yaci-cli-

      - name: Load cached Yaci DevKit image
        if: steps.plan.outputs.integration == 'true'
        run: |
          tarball="$HOME/.cache/docker-images/yaci-cli.tar"
          if [ -f "$tarball" ]; then
            docker load -i "$tarball"
          else
            echo "No cached image tarball — testcontainers will pull on demand."
          fi

      - name: Yaci integration tests (Docker)
        if: steps.plan.outputs.integration == 'true'
        run: nix develop .#ci --command just integration-yaci-docker

      # The Yaci suites log through the same config, and the file is rewritten per run.
      - name: Upload Yaci integration log
        if: always() && steps.plan.outputs.integration == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: yaci-log-attempt-${{ github.run_attempt }}
          path: integration/integration-tests.log
          if-no-files-found: ignore
          retention-days: 3

      - name: Save Yaci DevKit image to cache
        if: steps.plan.outputs.integration == 'true' && steps.yaci-image-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.cache/docker-images
          image=$(docker images --format '{{.Repository}}:{{.Tag}}' | grep '^bloxbean/yaci-cli:' | head -n1)
          if [ -z "$image" ]; then
            echo "No bloxbean/yaci-cli image found after the test run — nothing to cache." >&2
            exit 0
          fi
          docker save "$image" -o ~/.cache/docker-images/yaci-cli.tar

      # Name every failed test on the run page: a summary table plus one annotation per failure,
      # read from sbt's JUnit reports. Runs after a failing step too.
      - name: Summarise test results
        if: always() && steps.plan.outputs.code == 'true'
        run: python3 .github/scripts/test-summary.py target

      - name: Upload test reports
        if: always() && steps.plan.outputs.code == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-reports-attempt-${{ github.run_attempt }}
          path: target/out/jvm/*/*/test-reports/
          if-no-files-found: ignore
          retention-days: 3

      - name: No code changes — build/test skipped
        if: steps.plan.outputs.code != 'true'
        run: echo "Only docs or Markdown changed — skipping Nix, build and tests. The 'build' check passes."
