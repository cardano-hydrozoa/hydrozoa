name: CI

on:
  # Each merge to main is built from scratch, and that build's compiled classes are saved for pull
  # requests to start from; see "Choose the compile cache" in the plan job.
  push:
    branches: [main]
  pull_request:
  # A merge queue tests each queued PR (or batch) on top of main before merging it; this is the
  # event it sends. It fires only when the repository's ruleset enables the queue.
  merge_group:
  workflow_dispatch:
    inputs:
      compile-cache:
        description: >-
          none: compile from scratch. save: compile from scratch and save the compiled classes for
          later runs on this branch. restore: start from the classes a save left on this branch,
          or else on main.
        type: choice
        options: [none, save, restore]
        default: none

# A newer push to a pull request cancels the run for the older one. A run for main that has
# started is not cancelled: it is the build from scratch that the pull requests' compile cache
# comes from. A newer merge waits for it, and replaces any run for main still waiting to start.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# The jobs' GITHUB_TOKEN may only read the repository. It is minted per job and expires with it.
permissions:
  contents: read

# Every sbt call runs sbt in-process (the justfile's `sbt` variable reads this, and the recipes and
# steps that call sbt directly pass the same flags), rather than as the thin client of a server
# that a previous step started: the client can crash while connecting, failing the step, and a
# server keeps the environment of the step that started it.
env:
  SBT: sbt --server --batch
  # What a saved compile holds, for each project and configuration: zinc's analysis, the record
  # of which source (by content hash) each class file was compiled from and what depends on what,
  # and the class and SemanticDB files. With these zinc recompiles only the sources that differ
  # and what depends on them. sbt's own task cache (~/.cache/sbt) is never saved: it also records
  # which test suites passed, and `sbt test` skips those.
  COMPILED_PATHS: |
    target/out/jvm/*/*/zinc
    target/out/jvm/*/*/test-zinc
    target/out/jvm/*/*/classes
    target/out/jvm/*/*/test-classes
    target/out/jvm/*/*/meta
    target/out/jvm/*/*/test-meta

# `plan` decides from a PR's changed paths what runs; `unit` (precommit, the unit suites and the
# reporting canary), `integration` and `yaci` (the suites against a real Cardano devnet) run side
# by side; and `build` reports their outcome. The workflow itself has no path filter: `build` is
# the repository ruleset's required check on `main`, so it must always run and report, or the
# merge is blocked. A PR that touches no code runs only `plan` and `build`.
jobs:
  plan:
    # Pinned rather than ubuntu-latest, so the host image changes only when we change it. Nix
    # supplies the toolchain; the host matters for Docker (the Yaci suites), the kernel and disk.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.plan.outputs.code }}
      unit: ${{ steps.plan.outputs.unit }}
      integration: ${{ steps.plan.outputs.integration }}
      canary: ${{ steps.plan.outputs.canary }}
      compile-cache: ${{ steps.compile-cache.outputs.mode }}
      compile-key: ${{ steps.compile-cache.outputs.key }}
    steps:
      # Depth 2 brings in both parents of the PR test merge that `pull_request` checks out, which
      # is what "Plan the run" diffs against.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      # Decides which of the unit tests, the integration tests (Yaci included) and the reporting
      # canary a PR needs, from the files it changes; the script's header has the rules. A PR
      # confined to integration/ skips the unit tests, which that code can't affect; a change to
      # src/test/ runs both suites, since the integration suites build on core's test code.
      # Merge-queue and manual runs always run everything, and so does a PR whose change set
      # can't be determined.
      - name: Plan the run
        id: plan
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: .github/scripts/classify-changes.py

      # Whether the test jobs start their compile from a saved one (restore), compile from scratch
      # and save the result (save), or neither (none). A push to main saves; a pull request
      # restores the latest save with the same build definition (the hash in the key). GitHub
      # gives a pull request's run the caches of its own merge ref, its base branch and main, and
      # shows a cache that a pull request's run saves to no other ref, so no pull request can
      # change what another starts from. Only main and manual `save` runs save, so a pull request
      # based on main starts from main's latest build. A merge-queue run compiles from scratch, as
      # the last check before main. Every job's compile ends in the build's checkCompileState,
      # which fails unless zinc's analysis records exactly the current sources.
      - name: Choose the compile cache
        id: compile-cache
        env:
          EVENT: ${{ github.event_name }}
          DISPATCHED: ${{ inputs.compile-cache }}
          BUILD_HASH: ${{ hashFiles('build.sbt', 'project/**', 'flake.nix', 'flake.lock') }}
        run: |
          case "${EVENT}" in
            push) mode=save ;;
            pull_request) mode=restore ;;
            workflow_dispatch) mode=${DISPATCHED:-none} ;;
            *) mode=none ;;
          esac
          echo "Compile cache: ${mode}"
          echo "mode=${mode}" >> "${GITHUB_OUTPUT}"
          echo "key=compiled-v1-${RUNNER_OS}-${BUILD_HASH}" >> "${GITHUB_OUTPUT}"

  # Precommit runs here for every PR that runs any test, so this job runs whenever a test job does,
  # and skips its unit step when the plan didn't call for the unit tests.
  unit:
    needs: plan
    if: >-
      needs.plan.outputs.unit == 'true' || needs.plan.outputs.integration == 'true' ||
      needs.plan.outputs.canary == 'true'
    runs-on: ubuntu-24.04
    # Without a timeout the job inherits GitHub's 6-hour default, and a wedged step would hold a
    # hosted runner for hours and leave no diagnosable artifact.
    timeout-minutes: 60
    steps:
      # No token in .git/config: nothing in this job uses it through git, and the build runs
      # third-party code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Every sbt run in this job reports this build time, so each generates the same BuildInfo
      # source and none recompiles it (HYDROZOA_BUILD_TIME in build.sbt).
      - name: Fix the build time
        run: echo "HYDROZOA_BUILD_TIME=$(date +%s)" >> "$GITHUB_ENV"

      - name: Install Nix
        # Nix's own installer, pinned and verified; see the script.
        # Its download of the Nix tarball has no retry or timeout of its own.
        timeout-minutes: 5
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: .github/scripts/install-nix.sh

      # The one job that saves this cache; the others restore it only, since two jobs saving the
      # same key race for it.
      - name: Cache sbt / coursier / ivy
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.sbt
            ~/.cache/coursier
            ~/.ivy2/cache
          key: sbt-${{ runner.os }}-${{ hashFiles('**/build.sbt', 'project/**') }}
          restore-keys: sbt-${{ runner.os }}-

      # See "Choose the compile cache" in the plan job. The matched key names the main commit the
      # classes were compiled from.
      - name: Restore compiled classes
        if: needs.plan.outputs.compile-cache == 'restore'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.COMPILED_PATHS }}
          key: ${{ needs.plan.outputs.compile-key }}-${{ github.sha }}
          restore-keys: ${{ needs.plan.outputs.compile-key }}-

      # Compiles everything precommit and the tests need, under CI's -Werror, then checks that the
      # classes are of this checkout's sources. First, so that precommit's lint finds the classes
      # it reads up to date, rather than recompiling them without -Werror (Scalafix removes it)
      # and leaving the tests a second full compile.
      # `.#ci` is the flake's CI shell: what the recipes need, without the developer tools.
      - name: Compile
        id: compile
        run: nix develop .#ci --command sbt --server --batch checkCompileState

      # The one job that saves compiled classes: the others compile the same projects, and two
      # jobs saving one key race for it. Saved right after a successful compile, before any test
      # runs. sbt keeps each zinc analysis file as a link into its task cache, which isn't saved,
      # so the links are first replaced by the files they point to.
      - name: Prepare compiled classes for saving
        if: needs.plan.outputs.compile-cache == 'save'
        run: |
          find target/out/jvm -type l \( -path '*/zinc/*' -o -path '*/test-zinc/*' \) -print0 |
            while IFS= read -r -d '' link; do
              cp --remove-destination "$(readlink -f "${link}")" "${link}"
            done
      - name: Upload compiled classes
        if: needs.plan.outputs.compile-cache == 'save'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.COMPILED_PATHS }}
          key: ${{ needs.plan.outputs.compile-key }}-${{ github.sha }}

      # Runs even when the compile failed, so that one run reports formatting and lint as well.
      - name: Format / lint / nixfmt checks
        if: ${{ !cancelled() }}
        run: nix develop .#ci --command just precommit

      # The test steps run even when the precommit checks fail, so one run reports both: a
      # formatting slip is the most common first failure, and it shouldn't hide the tests.
      # Each test step has its own timeout, inside the job's, so that a hang still leaves time for
      # the summary below to report which step didn't finish.
      # Under CI the build points the forked test JVMs at logback-core-ci.xml: nothing on the
      # console, and in target/unit-tests.log, uploaded below, everything its loggers pass.
      - name: Unit tests
        id: unit
        if: ${{ !cancelled() && needs.plan.outputs.unit == 'true' }}
        timeout-minutes: 30
        run: nix develop .#ci --command just test

      # Tests whose outcomes are known, and a compile error on purpose: the step passes only if the
      # summary reports each of them exactly. Runs when the build or the reporting code changes.
      - name: Reporting canary
        id: canary
        if: ${{ !cancelled() && needs.plan.outputs.canary == 'true' }}
        timeout-minutes: 15
        run: nix develop .#ci --command just ci-canary

      - name: Upload unit test log
        if: always() && needs.plan.outputs.unit == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unit-log-attempt-${{ github.run_attempt }}
          path: target/unit-tests.log
          if-no-files-found: ignore
          retention-days: 3

      # Name every failed test on the run page: a summary plus error annotations, read from the
      # test-event files the build writes (see the script's header). Runs after a failing step
      # too. The steps' outcomes let it tell a pass from a step that failed without recording a
      # failed or unfinished test, as a compile error does.
      - name: Summarise test results
        if: always()
        env:
          TEST_STEPS: unit=${{ steps.unit.outcome }}
        run: python3 .github/scripts/test-summary.py target

      # Artifact names must be unique within a run, hence the job in each name.
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-reports-unit-attempt-${{ github.run_attempt }}
          path: target/out/jvm/*/*/test-reports/
          if-no-files-found: ignore
          retention-days: 3

  # A job of its own, alongside `unit`, so the two suites' times overlap rather than add up.
  integration:
    needs: plan
    if: needs.plan.outputs.integration == 'true'
    runs-on: ubuntu-24.04
    # Install (5), the shell, dependencies and compile, and the integration step's own 40 minutes.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Every sbt run in this job reports this build time, so each generates the same BuildInfo
      # source and none recompiles it (HYDROZOA_BUILD_TIME in build.sbt).
      - name: Fix the build time
        run: echo "HYDROZOA_BUILD_TIME=$(date +%s)" >> "$GITHUB_ENV"

      - name: Install Nix
        timeout-minutes: 5
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: .github/scripts/install-nix.sh

      - name: Restore sbt / coursier / ivy cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.sbt
            ~/.cache/coursier
            ~/.ivy2/cache
          key: sbt-${{ runner.os }}-${{ hashFiles('**/build.sbt', 'project/**') }}
          restore-keys: sbt-${{ runner.os }}-

      # As in `unit`, which saves them.
      - name: Restore compiled classes
        if: needs.plan.outputs.compile-cache == 'restore'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.COMPILED_PATHS }}
          key: ${{ needs.plan.outputs.compile-key }}-${{ github.sha }}
          restore-keys: ${{ needs.plan.outputs.compile-key }}-

      # A step of its own, so the integration step's timeout covers only the suites, and a compile
      # error reads as one rather than as a test failure. The same compile and check as in `unit`,
      # plus `examples`, whose demo suites no step runs.
      - name: Compile
        id: compile
        run: >-
          nix develop .#ci --command
          sbt --server --batch "checkCompileState; examples/Test/compile"

      # Under CI the build points the forked test JVMs at logback-ci.xml: nothing on the console,
      # and in integration/integration-tests.log, uploaded below, everything its loggers pass.
      - name: Integration tests
        id: integration
        timeout-minutes: 40
        run: nix develop .#ci --command just integration-fast

      - name: Upload integration log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: integration-log-attempt-${{ github.run_attempt }}
          path: |
            integration/integration-tests.log
          if-no-files-found: ignore
          retention-days: 3

      - name: Summarise test results
        if: always()
        env:
          TEST_STEPS: >-
            compile=${{ steps.compile.outcome }}
            integration=${{ steps.integration.outcome }}
        run: python3 .github/scripts/test-summary.py target

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-reports-integration-attempt-${{ github.run_attempt }}
          path: target/out/jvm/*/*/test-reports/
          if-no-files-found: ignore
          retention-days: 3

  # The Yaci suites start a Cardano devnet in Docker (Testcontainers pulls bloxbean/yaci-cli) and
  # run against it: CI's only real node, so the only check of our transactions against the
  # node's own ledger rules, script budgets and protocol-version gating. A job of its own, so it
  # reports even when another job fails early, and runs alongside them.
  yaci:
    needs: plan
    # The Yaci suites reach nearly all of the integration test code (the harness, the RBR model
    # and properties, Stage 4's generators), so they run whenever the integration suites do.
    if: needs.plan.outputs.integration == 'true'
    runs-on: ubuntu-24.04
    # Install (5), the shell, dependencies and compile, and the Yaci step's own 20 minutes.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Every sbt run in this job reports this build time, so each generates the same BuildInfo
      # source and none recompiles it (HYDROZOA_BUILD_TIME in build.sbt).
      - name: Fix the build time
        run: echo "HYDROZOA_BUILD_TIME=$(date +%s)" >> "$GITHUB_ENV"

      - name: Install Nix
        timeout-minutes: 5
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: .github/scripts/install-nix.sh

      # Restore only: `unit` saves this key, and two jobs saving the same key race for it.
      - name: Restore sbt / coursier / ivy cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.sbt
            ~/.cache/coursier
            ~/.ivy2/cache
          key: sbt-${{ runner.os }}-${{ hashFiles('**/build.sbt', 'project/**') }}
          restore-keys: sbt-${{ runner.os }}-

      # As in `unit`, which saves them.
      - name: Restore compiled classes
        if: needs.plan.outputs.compile-cache == 'restore'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.COMPILED_PATHS }}
          key: ${{ needs.plan.outputs.compile-key }}-${{ github.sha }}
          restore-keys: ${{ needs.plan.outputs.compile-key }}-

      # A step of its own, so the Yaci step's timeout covers only the suites, and a compile error
      # reads as one rather than as a Yaci failure. The same compile and check as in `unit`.
      - name: Compile
        id: compile
        run: nix develop .#ci --command sbt --server --batch checkCompileState

      # The suites can hang: 20 minutes fails a hang fast, and still leaves room above a normal
      # run on a compiled tree for a slow image pull.
      - name: Yaci integration tests (Docker)
        id: yaci
        timeout-minutes: 20
        run: nix develop .#ci --command just integration-yaci-docker

      # The Yaci suites log through the same config as the integration tests.
      - name: Upload Yaci integration log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: yaci-log-attempt-${{ github.run_attempt }}
          path: integration/integration-tests.log
          if-no-files-found: ignore
          retention-days: 3

      - name: Summarise test results
        if: always()
        env:
          TEST_STEPS: compile=${{ steps.compile.outcome }} yaci=${{ steps.yaci.outcome }}
        run: python3 .github/scripts/test-summary.py target

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-reports-yaci-attempt-${{ github.run_attempt }}
          path: target/out/jvm/*/*/test-reports/
          if-no-files-found: ignore
          retention-days: 3

  # The required check. Passes when the plan succeeded and each test job either passed or was
  # skipped because the plan didn't call for it; see the script for the rules.
  build:
    needs: [plan, unit, integration, yaci]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Check the jobs' results
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: .github/scripts/check-jobs.py
