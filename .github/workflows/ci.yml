name: CI

on:
  pull_request:
  # A merge queue tests each queued PR (or batch) on top of main before merging it; this is the
  # event it sends. Harmless until the queue is enabled in the repository's ruleset.
  merge_group:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The jobs' GITHUB_TOKEN may only read the repository. It is minted per job and expires with it.
permissions:
  contents: read

# Every sbt call runs sbt in-process, through the justfile's `sbt` variable, rather than as the thin
# client of a server that a previous step started: the client can crash while connecting, failing
# the step, and a server keeps the environment of the step that started it.
env:
  SBT: sbt --server --batch

# Four jobs: `plan` decides from a PR's changed paths what runs; `tests` (precommit, unit and
# integration suites) and `yaci` (the suites against a real Cardano devnet) run side by side; and
# `build` reports their outcome. We do NOT path-filter the workflow itself: `build` is the
# repository ruleset's required check on `main`, so it must always run and report, or the merge is
# blocked. A PR that touches no code passes in about a minute.
jobs:
  plan:
    # Pinned rather than ubuntu-latest, so the host image changes only when we change it. Nix
    # supplies the toolchain; the host matters for Docker (the Yaci suites), the kernel and disk.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.plan.outputs.code }}
      unit: ${{ steps.plan.outputs.unit }}
      integration: ${{ steps.plan.outputs.integration }}
    steps:
      # Depth 2 brings in both parents of the PR test merge that `pull_request` checks out, which
      # is what "Plan the run" diffs against.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      # What runs: everything, unless this is a PR whose changes are confined to integration-test
      # code, the API schemas or docs. The script puts each changed file in one bucket; see its
      # header. Integration-test code can't affect the unit tests, so a PR confined to
      # integration/ skips them; the integration suites build on core's test code, so a change
      # to src/test/ runs everything. Merge-queue and manual runs always run everything, and so
      # does a PR whose change set can't be determined.
      - name: Plan the run
        id: plan
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: .github/scripts/classify-changes.py

  tests:
    needs: plan
    if: needs.plan.outputs.unit == 'true' || needs.plan.outputs.integration == 'true'
    runs-on: ubuntu-24.04
    # Without this the job inherits GitHub's 6-hour default. The integration suite has wedged
    # before (real-clock properties), and each time it burned hours of a hosted runner and produced
    # no diagnosable artifact. 90 minutes turns a wedge into a red build within the hour or so.
    timeout-minutes: 90
    steps:
      # Nothing in this job uses the token through git, and the build runs third-party code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        # Nix's own installer, pinned and verified; see the script.
        # Its download of the Nix tarball has no retry or timeout of its own.
        timeout-minutes: 5
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: .github/scripts/install-nix.sh

      - name: Cache sbt / coursier / ivy
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.sbt
            ~/.cache/coursier
            ~/.ivy2/cache
          key: sbt-${{ runner.os }}-${{ hashFiles('**/build.sbt', 'project/**') }}
          restore-keys: sbt-${{ runner.os }}-

      # `.#ci` is the flake's CI shell: the JDK, sbt, just and nixfmt, without the developer tools.
      - name: Format / lint / nixfmt checks
        run: nix develop .#ci --command just precommit

      # The test steps run even when the precommit checks fail, so one run reports both: a
      # formatting slip is the most common first failure, and it shouldn't hide the tests.
      # Each test step has its own timeout, inside the job's, so that a hang still leaves time for
      # the summary below to report which step didn't finish.
      - name: Unit tests
        id: unit
        if: ${{ !cancelled() && needs.plan.outputs.unit == 'true' }}
        timeout-minutes: 30
        run: nix develop .#ci --command just test

      # Under CI the build points the forked test JVMs at logback-ci.xml: WARN and above on the
      # console, everything down to TRACE in integration/integration-tests.log, uploaded below.
      - name: Integration tests
        id: integration
        if: ${{ !cancelled() && needs.plan.outputs.integration == 'true' }}
        timeout-minutes: 40
        run: nix develop .#ci --command just integration-fast

      - name: Upload integration log
        if: always() && needs.plan.outputs.integration == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: integration-log-attempt-${{ github.run_attempt }}
          path: |
            integration/integration-tests.log
            integration/stage4-peers-interaction.mmd
          if-no-files-found: ignore
          retention-days: 3

      # Name every failed test on the run page: a summary plus one annotation per failure, read
      # from sbt's JUnit reports. Runs after a failing step too. The steps' outcomes let it tell
      # "passed" from "didn't finish": a hang or a compile error leaves no report behind.
      - name: Summarise test results
        if: always()
        env:
          TEST_STEPS: unit=${{ steps.unit.outcome }} integration=${{ steps.integration.outcome }}
        run: python3 .github/scripts/test-summary.py target

      # Artifact names must be unique within a run, hence the job in each name.
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-reports-tests-attempt-${{ github.run_attempt }}
          path: target/out/jvm/*/*/test-reports/
          if-no-files-found: ignore
          retention-days: 3

  # The Yaci suites start a Cardano devnet in Docker (Testcontainers pulls bloxbean/yaci-cli) and
  # run against it: CI's only real node, so the only check of our transactions against the
  # node's own ledger rules, script budgets and protocol-version gating. A job of its own, so it
  # reports even when `tests` fails early, and its wall time overlaps theirs.
  yaci:
    needs: plan
    # The Yaci suites reach nearly all of the integration test code (the harness, the RBR model
    # and properties, Stage 4's generators), so they run whenever the integration suites do.
    if: needs.plan.outputs.integration == 'true'
    runs-on: ubuntu-24.04
    # Install (5), the shell, dependencies and compile, and the Yaci step's own 20 minutes.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        timeout-minutes: 5
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: .github/scripts/install-nix.sh

      # Restore only: `tests` saves this key, and two jobs saving the same key race for it.
      - name: Restore sbt / coursier / ivy cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.sbt
            ~/.cache/coursier
            ~/.ivy2/cache
          key: sbt-${{ runner.os }}-${{ hashFiles('**/build.sbt', 'project/**') }}
          restore-keys: sbt-${{ runner.os }}-

      # A step of its own, so the Yaci step's timeout covers only the suites, and a compile error
      # reads as one rather than as a Yaci failure.
      - name: Compile
        id: compile
        run: nix develop .#ci --command sbt --server --batch integration/Test/compile

      # Median about 7 minutes on a compiled tree. It has hung until the job timeout three times;
      # 20 minutes fails a hang fast and still leaves room for a slow image pull.
      - name: Yaci integration tests (Docker)
        id: yaci
        timeout-minutes: 20
        run: nix develop .#ci --command just integration-yaci-docker

      # The Yaci suites log through the same config as the integration tests.
      - name: Upload Yaci integration log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: yaci-log-attempt-${{ github.run_attempt }}
          path: integration/integration-tests.log
          if-no-files-found: ignore
          retention-days: 3

      - name: Summarise test results
        if: always()
        env:
          TEST_STEPS: compile=${{ steps.compile.outcome }} yaci=${{ steps.yaci.outcome }}
        run: python3 .github/scripts/test-summary.py target

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-reports-yaci-attempt-${{ github.run_attempt }}
          path: target/out/jvm/*/*/test-reports/
          if-no-files-found: ignore
          retention-days: 3

  # The required check. Passes when the plan succeeded and each test job either passed or was
  # skipped because the plan didn't call for it; see the script for the rules.
  build:
    needs: [plan, tests, yaci]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Check the jobs' results
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: .github/scripts/check-jobs.py
