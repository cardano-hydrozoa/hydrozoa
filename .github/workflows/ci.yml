name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The `build` job is a required status check (repository ruleset on `main`). It must ALWAYS run
  # and report, or the ruleset blocks the merge — so we do NOT path-filter the workflow itself.
  # Instead, a docs-only PR skips the expensive Nix/sbt steps and the check passes in ~1 min.
  build:
    runs-on: ubuntu-latest
    # Without this the job inherits GitHub's 6-hour default. The integration suite has wedged
    # repeatedly (the Stage-4 "Two-heads-one-coil works WS" property, on the real clock), and each
    # time it burned hours of a hosted runner, silently skipped the steps after it, and produced no
    # diagnosable artifact. The norm for this job is ~46 min; 90 leaves generous headroom while
    # turning a wedge into a red build within the hour.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # On a PR, decide whether anything outside docs/ changed. `code == 'false'` means docs-only.
      - name: Detect non-docs changes
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            code:
              - '!docs/**'

      # Everything below runs for code changes and for manual (workflow_dispatch) runs; it is
      # skipped only on a docs-only PR.
      - name: Install Nix
        if: github.event_name != 'pull_request' || steps.filter.outputs.code == 'true'
        uses: DeterminateSystems/nix-installer-action@main

      - name: Cache sbt / coursier / ivy
        if: github.event_name != 'pull_request' || steps.filter.outputs.code == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.sbt
            ~/.cache/coursier
            ~/.ivy2/cache
          key: sbt-${{ runner.os }}-${{ hashFiles('**/build.sbt', 'project/**') }}
          restore-keys: sbt-${{ runner.os }}-

      # TEMP (revert before merge): disabled to iterate fast on the Yaci Docker step only.
      - name: Format / lint / nixfmt checks
        if: false
        run: nix develop --command just precommit

      # TEMP (revert before merge): disabled to iterate fast on the Yaci Docker step only.
      - name: Unit tests
        if: false
        run: nix develop --command just test

      # TEMP (revert before merge): disabled to iterate fast on the Yaci Docker step only.
      - name: Integration tests
        if: false
        env:
          JAVA_TOOL_OPTIONS: -Dlogback.configurationFile=classpath:logback-ci.xml
        run: nix develop --command just integration-fast

      # The bloxbean/yaci-cli image is ~578 MB and dominates the yaci-suite runtime on a
      # cold runner (~3.5 min pull). Cache the tarball keyed on build.sbt so any bump of
      # testcontainers / scalus-testkit / bloxbean invalidates it, but everything else
      # rides on the last cached image (via restore-keys). Testcontainers picks up the
      # loaded image transparently — no shim required.
      - name: Cache Yaci DevKit image
        if: github.event_name != 'pull_request' || steps.filter.outputs.code == 'true'
        id: yaci-image-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/docker-images/yaci-cli.tar
          key: docker-yaci-cli-${{ hashFiles('**/build.sbt') }}
          restore-keys: docker-yaci-cli-

      - name: Load cached Yaci DevKit image
        if: github.event_name != 'pull_request' || steps.filter.outputs.code == 'true'
        run: |
          tarball="$HOME/.cache/docker-images/yaci-cli.tar"
          if [ -f "$tarball" ]; then
            docker load -i "$tarball"
          else
            echo "No cached image tarball — testcontainers will pull on demand."
          fi

      - name: Yaci integration tests (Docker)
        if: github.event_name != 'pull_request' || steps.filter.outputs.code == 'true'
        env:
          JAVA_TOOL_OPTIONS: -Dlogback.configurationFile=classpath:logback-ci.xml
        run: nix develop --command just integration-yaci-docker

      - name: Save Yaci DevKit image to cache
        if: (github.event_name != 'pull_request' || steps.filter.outputs.code == 'true') && steps.yaci-image-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.cache/docker-images
          image=$(docker images --format '{{.Repository}}:{{.Tag}}' | grep '^bloxbean/yaci-cli:' | head -n1)
          if [ -z "$image" ]; then
            echo "No bloxbean/yaci-cli image found after the test run — nothing to cache." >&2
            exit 0
          fi
          docker save "$image" -o ~/.cache/docker-images/yaci-cli.tar

      - name: Docs-only change — build/test skipped
        if: github.event_name == 'pull_request' && steps.filter.outputs.code != 'true'
        run: echo "Only docs/** changed — skipping Nix build, tests, and integration. The 'build' check passes."
