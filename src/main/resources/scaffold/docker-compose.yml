# A multi-peer Hydrozoa head: 2 head peers + 4 coil peers, each a single hydrozoa node running the
# built-in EUTXO L2 ledger in-process — no ledger sidecar, no external database. Every node mounts
# the shared head-config.json plus its own private.json; head peers publish their user/admin HTTP
# API, coil peers dial out only. See docs/user-guide/DEPLOYMENT.md §6.
#
# This file is scaffolded into the head directory itself, so config paths are relative to it (`.`):
# `docker compose up` from here mounts ./head-config and ./private. HYDROZOA_IMAGE overrides the
# image (e.g. a local cardano-hydrozoa/hydrozoa:<version>).
#
# Each service pins a fixed container_name (head-0, coil-0, …) so container names stay clean (no
# compose `-N` index suffix). Because those names are host-global, only one head can run per machine
# at a time — bring one down before starting another (e.g. a different network's head directory).
#
# State is DURABLE: each peer's RocksDB store lives on a named volume, so it survives a container
# restart/recreation (which is what crash recovery and evacuation read). Reset to a fresh head with
# `docker compose down -v` (wipes the volumes). The `evacuate` profile adds one `*-evac` service per
# peer that runs `hydrozoa evacuate` against that store; it stays inert on a plain `up` and starts
# only with `--profile evacuate` (see docs/user-guide/DEPLOYMENT.md, "Evacuation").

name: hydrozoa

networks:
  mesh:
    driver_opts:
      # Rootless docker (slirp4netns) can drop outbound TLS to Blockfrost at the default MTU.
      com.docker.network.driver.mtu: 1400

x-hydrozoa: &hydrozoa
  image: ${HYDROZOA_IMAGE:-ghcr.io/cardano-hydrozoa/hydrozoa:${HYDROZOA_VERSION:-latest}}
  # root: the image's non-root user cannot write the RocksDB stores / logs under the /opt/docker
  # workdir.
  user: root
  environment:
    JAVA_OPTS: -Xmx1g -Xms256m
  command: ["serve", "/configs/head-config.json", "/configs/private.json"]
  networks: [mesh]
  # Upstream resolver so the node can reach Blockfrost; the embedded DNS still resolves the
  # mesh service names (head-0, head-1, …) for the inter-peer WS mesh.
  dns:
    - 8.8.8.8
    - 8.8.4.4
  stop_grace_period: 120s
  restart: on-failure

# The `evacuate`-profile counterpart: same image, but runs `hydrozoa evacuate` (the rule-based
# regime — submit the fallback, resolve the dispute, pay every L2 utxo back out on L1) against a
# peer's durable store, opened read-only. `evacuate` requires an image that includes it (`:latest`
# once a release ships it, or a local build via HYDROZOA_IMAGE / HYDROZOA_VERSION).
x-hydrozoa-evac: &hydrozoa-evac
  image: ${HYDROZOA_IMAGE:-ghcr.io/cardano-hydrozoa/hydrozoa:${HYDROZOA_VERSION:-latest}}
  user: root
  environment:
    JAVA_OPTS: -Xmx1g -Xms256m
  command: ["evacuate", "/configs/head-config.json", "/configs/private.json"]
  networks: [mesh]
  dns:
    - 8.8.8.8
    - 8.8.4.4
  # Don't start on a plain `up`; only with `--profile evacuate`. Stop the matching serve peer first.
  profiles: ["evacuate"]
  stop_grace_period: 120s
  restart: on-failure

# Durable per-peer stores. Named volumes persist across container recreation; wipe with `down -v`.
volumes:
  hydrozoa-data-head-0:
  hydrozoa-data-head-1:
  hydrozoa-data-coil-0:
  hydrozoa-data-coil-1:
  hydrozoa-data-coil-2:
  hydrozoa-data-coil-3:

services:
  ## ------------------------------------------------------- Yaci devnet (optional local L1)
  # Only started under the `yaci` profile (`docker compose --profile yaci …`); the default `up`
  # targets a public testnet via Blockfrost. For local dev/testing you can run the head against a
  # local Yaci devnet instead — see docs/user-guide/DEPLOYMENT.md, "Running against a local Yaci
  # DevKit". The idle yaci-cli container boots with `sleep infinity`; the devnet is created by
  # driving the CLI into it:
  #   docker compose --profile yaci exec -d yaci /app/yaci-cli.sh create-node -o --start
  # yaci_store_enabled makes create-node also bring up the Blockfrost-compatible API on 8080.
  yaci:
    profiles: ["yaci"]
    container_name: yaci
    image: bloxbean/yaci-cli:0.10.6
    entrypoint: [sleep, infinity]
    environment:
      yaci_store_enabled: "true"
      yaci_store_mode: native
    ports:
      - "18080:8080"   # store / Blockfrost-compatible API (host 18080 — head-0/1 own 8080/8081)
      - "10000:10000"  # local-cluster / admin API (topup / devnet info)
    networks: [mesh]

  ## ---------------------------------------------------------- head peers (publish the HTTP API)

  head-0:
    <<: *hydrozoa
    container_name: head-0
    ports:
      - "8080:8080"   # head-0 user/admin HTTP API
    volumes:
      - hydrozoa-data-head-0:/opt/docker/.hydrozoa-data
      - ./head-config/head-config.json:/configs/head-config.json:ro
      - ./private/head-0/private.json:/configs/private.json:ro

  head-1:
    <<: *hydrozoa
    container_name: head-1
    ports:
      - "8081:8080"   # head-1 user/admin HTTP API
    volumes:
      - hydrozoa-data-head-1:/opt/docker/.hydrozoa-data
      - ./head-config/head-config.json:/configs/head-config.json:ro
      - ./private/head-1/private.json:/configs/private.json:ro

  ## ---------------------------------------------------------- coil peers (dial out only)

  coil-0:
    <<: *hydrozoa
    container_name: coil-0
    volumes:
      - hydrozoa-data-coil-0:/opt/docker/.hydrozoa-data
      - ./head-config/head-config.json:/configs/head-config.json:ro
      - ./private/coil-0/private.json:/configs/private.json:ro

  coil-1:
    <<: *hydrozoa
    container_name: coil-1
    volumes:
      - hydrozoa-data-coil-1:/opt/docker/.hydrozoa-data
      - ./head-config/head-config.json:/configs/head-config.json:ro
      - ./private/coil-1/private.json:/configs/private.json:ro

  coil-2:
    <<: *hydrozoa
    container_name: coil-2
    volumes:
      - hydrozoa-data-coil-2:/opt/docker/.hydrozoa-data
      - ./head-config/head-config.json:/configs/head-config.json:ro
      - ./private/coil-2/private.json:/configs/private.json:ro

  coil-3:
    <<: *hydrozoa
    container_name: coil-3
    volumes:
      - hydrozoa-data-coil-3:/opt/docker/.hydrozoa-data
      - ./head-config/head-config.json:/configs/head-config.json:ro
      - ./private/coil-3/private.json:/configs/private.json:ro

  ## -------------------------------------------------------------- evacuation (profile: evacuate)
  ## One service per peer, each reading that peer's store (read-only) and driving the rule-based
  ## regime. Stop the matching serve peer before running these.

  head-0-evac:
    <<: *hydrozoa-evac
    container_name: head-0-evac
    volumes:
      - hydrozoa-data-head-0:/opt/docker/.hydrozoa-data
      - ./head-config/head-config.json:/configs/head-config.json:ro
      - ./private/head-0/private.json:/configs/private.json:ro

  head-1-evac:
    <<: *hydrozoa-evac
    container_name: head-1-evac
    volumes:
      - hydrozoa-data-head-1:/opt/docker/.hydrozoa-data
      - ./head-config/head-config.json:/configs/head-config.json:ro
      - ./private/head-1/private.json:/configs/private.json:ro

  coil-0-evac:
    <<: *hydrozoa-evac
    container_name: coil-0-evac
    volumes:
      - hydrozoa-data-coil-0:/opt/docker/.hydrozoa-data
      - ./head-config/head-config.json:/configs/head-config.json:ro
      - ./private/coil-0/private.json:/configs/private.json:ro

  coil-1-evac:
    <<: *hydrozoa-evac
    container_name: coil-1-evac
    volumes:
      - hydrozoa-data-coil-1:/opt/docker/.hydrozoa-data
      - ./head-config/head-config.json:/configs/head-config.json:ro
      - ./private/coil-1/private.json:/configs/private.json:ro

  coil-2-evac:
    <<: *hydrozoa-evac
    container_name: coil-2-evac
    volumes:
      - hydrozoa-data-coil-2:/opt/docker/.hydrozoa-data
      - ./head-config/head-config.json:/configs/head-config.json:ro
      - ./private/coil-2/private.json:/configs/private.json:ro

  coil-3-evac:
    <<: *hydrozoa-evac
    container_name: coil-3-evac
    volumes:
      - hydrozoa-data-coil-3:/opt/docker/.hydrozoa-data
      - ./head-config/head-config.json:/configs/head-config.json:ro
      - ./private/coil-3/private.json:/configs/private.json:ro
