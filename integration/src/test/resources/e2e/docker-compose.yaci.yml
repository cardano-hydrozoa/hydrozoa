# A 4-head-peer Hydrozoa head on a local Yaci devnet, for the e2e L2-propagation test (WI-004).
#
# Topology: one `yaci` service (a Cardano devnet exposing a Blockfrost-compatible API + an admin
# API) plus 4 head peers, each a single hydrozoa node running the built-in EUTXO L2 ledger
# in-process. All four publish their user/admin HTTP API (host 8080-8083). Unlike the standard
# docker-compose.yml (2 head + 4 coil, on Blockfrost.io), every peer here targets the in-compose
# Yaci via `cardanoBackendUrl = http://yaci:8080/api/v1` (baked into each private.json by
# `keygen-fleet --blockfrost-url http://yaci:8080/api/v1`).
#
# Two URL contexts (see design.md §6):
#   - in-compose (containers → Yaci):  http://yaci:8080/api/v1   (the mesh service name)
#   - host-side (the CLI generation steps + DevKit.topup → Yaci):
#       Blockfrost  http://localhost:18080/api/v1   (host 18080; heads own 8080-8083)
#       admin       http://localhost:10000/local-cluster/api
#
# Bring-up is driven by the WI-004 test (host-side): start `yaci`, run keygen-fleet (custom) →
# DevKit.topup head-0 → deploy-scripts → build-head-config against the host URLs, then bring up the
# 4 heads. HYDROZOA_IMAGE overrides the hydrozoa image (default: a locally built one).

name: hydrozoa-yaci

networks:
  mesh:
    driver_opts:
      # Rootless docker (slirp4netns) can drop outbound TLS at the default MTU.
      com.docker.network.driver.mtu: 1400

services:
  ## ------------------------------------------------------------------ Yaci devnet (Blockfrost API)
  # Yaci DevKit's yaci-cli container boots idle (`sleep infinity`); the devnet is created by driving
  # the CLI into it, which the WI-004 test does after `up` and before the heads (block/slot time set
  # here for a fast wall-clock test):
  #   docker compose -f … exec yaci /app/yaci-cli.sh create-node -o --start --block-time 1 --slot-length 1
  # The Docker devnet is fixed to protocolMagic 42 / Testnet. Blockfrost API on 8080, admin on 10000.
  yaci:
    image: bloxbean/yaci-cli:0.10.6 # bump to the tag you run (local checkout: 0.12.0-beta6)
    entrypoint: [sleep, infinity]
    ports:
      - "18080:8080" # store / Blockfrost-compatible API (host 18080 — heads own 8080-8083)
      - "10000:10000" # local-cluster / admin API (DevKit.topup / reset / devnetInfo)
    networks: [mesh]

  ## ------------------------------------------------------------------ head peers (publish HTTP API)
  head-0: &head
    image: ${HYDROZOA_IMAGE:-cardano-hydrozoa/hydrozoa:0.1.0}
    # root: the image's non-root user cannot write the RocksDB stores / logs under /opt/docker.
    user: root
    environment:
      JAVA_OPTS: -Xmx1g -Xms256m
    command: ["serve", "/configs/head-config.json", "/configs/private.json"]
    networks: [mesh]
    depends_on: [yaci]
    stop_grace_period: 120s
    restart: on-failure
    ports:
      - "8080:8080" # hydrozoa head-0 user/admin HTTP API
    volumes:
      - ${HYDROZOA_HOME:-./head/demo}/head-config/head-config.json:/configs/head-config.json:ro
      - ${HYDROZOA_HOME:-./head/demo}/private/head-0/private.json:/configs/private.json:ro

  head-1:
    <<: *head
    ports:
      - "8081:8080"
    volumes:
      - ${HYDROZOA_HOME:-./head/demo}/head-config/head-config.json:/configs/head-config.json:ro
      - ${HYDROZOA_HOME:-./head/demo}/private/head-1/private.json:/configs/private.json:ro

  head-2:
    <<: *head
    ports:
      - "8082:8080"
    volumes:
      - ${HYDROZOA_HOME:-./head/demo}/head-config/head-config.json:/configs/head-config.json:ro
      - ${HYDROZOA_HOME:-./head/demo}/private/head-2/private.json:/configs/private.json:ro

  head-3:
    <<: *head
    ports:
      - "8083:8080"
    volumes:
      - ${HYDROZOA_HOME:-./head/demo}/head-config/head-config.json:/configs/head-config.json:ro
      - ${HYDROZOA_HOME:-./head/demo}/private/head-3/private.json:/configs/private.json:ro
