syntax = "proto3";

package hydrozoa.request;

// The canonical durable form of one entry in a head peer's Request journal — the schema
// contract between Hydrozoa (Scala, the only writer) and the Sugar Rush ledger (Rust, a
// read-only RocksDB secondary reader).
//
// The record is the *value* stored at a Request-lane key. The stored bytes are
// `[arrival stamp : 12][RequestRecord …]`: the 12-byte arrival stamp is the persistence
// layer's generic journal framing across all six journals, carries no protocol meaning, and
// is skipped by a reader that only wants the record.
//
// The key supplies the same identity from the other side — the column family is the author
// and the key is the request number — so a reader can cross-check the two and treat a
// mismatch as store corruption.
//
// Golden fixtures pinning this encoding live in the Hydrozoa repo at
// `src/test/resources/golden/request-record/`; a reader in another repo vendors a copy and
// asserts it decodes them to the same values.
message RequestRecord {
  // The assigning head peer's number, and its per-author sequential request number.
  uint32 head_peer_number = 1;
  uint64 request_number = 2;

  // Exactly one body is present; which one is the request's kind.
  oneof body {
    DepositBody deposit = 3;
    TransactionBody transaction = 4;
  }

  // The request's content digest: 32 bytes, blake2b-256 over a domain-tagged, variant-tagged
  // preimage of the body above, as the submitter computed it. Only the assigning peer verifies
  // it against the body, before writing its own record; every other peer stores it as it arrived
  // and recomputes it from the body before relying on it, refusing to build a block on a request
  // whose digest does not describe its body. So in a peer's store only the records under that
  // peer's own author number carry a digest it verified before writing; for any other author's, a
  // reader that needs the digest to match the body recomputes it.
  //
  // It is stored rather than derived because it is what a block body names a request by: the
  // block commits to which payload sits at each position without carrying any payload. The
  // construction is specified in `docs/user-guide/REQUEST-HASH.md`.
  bytes request_hash = 5;
}

// A deposit: the CBOR-encoded L1 deposit transaction, and the opaque L2 payload it pins.
message DepositBody {
  bytes l1_payload = 1;
  bytes l2_payload = 2;
}

// An L2 transaction: one opaque payload, passed to the L2 ledger unmodified.
message TransactionBody {
  bytes l2_payload = 1;
}
