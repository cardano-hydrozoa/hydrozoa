// Local single-process Canton for the Hydrozoa-on-Canton PoC (design §8 step 2,
// §11 "PoC topology"). One synchronizer we own (BFT sequencer + mediator) plus
// three participants, so the `custodian` party can be multi-hosted at a 2-of-3
// confirmation threshold (OQ-2) while a separate `settlementAgent` drives exit.
// In-memory storage — ephemeral, no Postgres; fine for a dev PoC.
canton {
  sequencers.sequencer1 {
    storage.type = memory
    public-api.port = 5001
    admin-api.port = 5002
    sequencer.type = BFT
  }

  mediators.mediator1 {
    storage.type = memory
    admin-api.port = 5202
  }

  participants {
    participant1 {
      storage.type = memory
      admin-api.port = 5012
      ledger-api.port = 5011
      http-ledger-api.port = 5013
    }
    participant2 {
      storage.type = memory
      admin-api.port = 5022
      ledger-api.port = 5021
      http-ledger-api.port = 5023
    }
    participant3 {
      storage.type = memory
      admin-api.port = 5032
      ledger-api.port = 5031
      http-ledger-api.port = 5033
    }
  }
}
