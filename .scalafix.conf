rules = [
  ExplicitResultTypes
  OrganizeImports
  LeakingImplicitClassVal
  NoValInForComprehension
  ProcedureSyntax
  RedundantSyntax
  DisableSyntax
]

# Keep the SLF4J/log4cats coupling pinned to the single bridge in Slf4jTracer.scala. Everything
# else logs through a ContraTracer and reaches the backend via Slf4jTracer.sink. The two lines in
# Slf4jTracer.scala that legitimately touch the backend carry `// scalafix:ok DisableSyntax`.
DisableSyntax.regex = [
  {
    id = "noDirectSlf4j"
    pattern = "org\\.slf4j|org\\.typelevel\\.log4cats"
    message = "Do not couple to SLF4J/log4cats directly. Hold a ContraTracer and reach the backend via Slf4jTracer.sink; the only bridge lives in Slf4jTracer.scala."
  }
]

ExplicitResultTypes {
  # Scalafix's ExplicitResultTypes presentation compiler is built for a different Scala 3
  # patch (3.3.8 in sbt-scalafix 0.14.7) than the project's 3.3.7; fetch the matching
  # compiler artifacts so the scalus compiler plugin loads into it without crashing
  # (otherwise: `key not found: posttyper` during plugin phase scheduling).
  fetchScala3CompilerArtifactsOnVersionMismatch = true
}

OrganizeImports {
  groupedImports = Merge
  groups = [
    "hydrozoa.*"
    "scalus.*"
    "com.suprnation.*"
    "cats.*"
    "scala.*"
    "*"
  ]
  removeUnused = true
  importSelectorsOrder = Ascii
  importsOrder = Ascii
  preset = DEFAULT
  targetDialect = Scala3
}
